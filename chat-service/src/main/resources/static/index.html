<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Chat Stream Viewer</title>
    <!-- Include SockJS and STOMP libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        .controls { margin-bottom: 20px; display: flex; gap: 10px; }
        input { padding: 10px; flex-grow: 1; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #chat-box { border: 1px solid #ddd; height: 400px; overflow-y: auto; padding: 15px; background-color: #f9f9f9; border-radius: 4px; }
        .chat-message { margin-bottom: 10px; padding: 8px; background: white; border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .sender { font-weight: bold; color: #d9534f; margin-right: 5px; }
    </style>
</head>
<body>

    <h2>🔴 Live Stream Chat</h2>
    
    <div class="controls">
        <input type="text" id="stream-id" placeholder="Enter Stream ID (e.g., s5)" />
        <button onclick="connectToStream()">Connect</button>
    </div>

    <div id="chat-box">
        <!-- Live messages will appear here -->
    </div>

    <script>
        let stompClient = null;

        function connectToStream() {
            const streamId = document.getElementById('stream-id').value;
            if (!streamId) {
                alert("Please enter a Stream ID to connect!");
                return;
            }

            // 1. Establish the SockJS connection to your Spring Boot endpoint
            const socket = new SockJS('http://localhost:7070/ws-chat');
            stompClient = Stomp.over(socket);

            // 2. Connect via STOMP
            stompClient.connect({}, function (frame) {
                console.log('Connected: ' + frame);
                document.getElementById('chat-box').innerHTML += `<div class="chat-message"><em>🔌 Connected to stream room: ${streamId}</em></div>`;
                
                // 3. Subscribe to the specific topic routed by your Kafka Consumer
                stompClient.subscribe('/topic/chat/' + streamId, function (messageOutput) {
                    displayMessage(JSON.parse(messageOutput.body));
                });
            });
        }

        function displayMessage(message) {
            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML += `
                <div class="chat-message">
                    <span class="sender">${message.sender}:</span> 
                    <span class="content">${message.content}</span>
                </div>
            `;
            // Auto-scroll to the bottom
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
